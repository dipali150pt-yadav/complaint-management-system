# Production Configuration for Deployment

spring.application.name=complaintsystem

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration (PostgreSQL for Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging (Production level)
logging.level.root=INFO
logging.level.com.cms.complaintsystem=INFO
logging.level.org.hibernate.SQL=WARN

# AI Configuration (From environment variables for security)
ai.provider=${AI_PROVIDER:local}
openai.api.key=${OPENAI_API_KEY:}
google.cloud.vision.api.key=${GOOGLE_CLOUD_API_KEY:}

# Application Settings
app.upload.dir=/tmp/uploads
app.ai.enabled=true
app.ai.confidence.threshold=0.6
app.ai.auto.assign=true

# Server Configuration
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# Disable open-in-view warning
spring.jpa.open-in-view=false
