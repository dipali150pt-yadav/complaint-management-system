spring.application.name=complaintsystem

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/complaintdb
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ========================================
# AI SERVICE CONFIGURATION
# ========================================

# AI Provider: Choose 'openai', 'google', or 'local' (fallback)
# - 'openai': Uses OpenAI GPT-4 Vision API (Recommended for best accuracy)
# - 'google': Uses Google Cloud Vision API
# - 'local': Uses rule-based local analysis (no API needed)
ai.provider=local

# OpenAI API Configuration
# Get your API key from: https://platform.openai.com/api-keys
openai.api.key=

# Google Cloud Vision API Configuration
# Get your API key from: https://console.cloud.google.com/apis/credentials
google.cloud.vision.api.key=

# ========================================
# APPLICATION SETTINGS
# ========================================

# Upload directory path
app.upload.dir=${user.dir}/uploads

# Enable/disable AI analysis
app.ai.enabled=true

# AI confidence threshold (0.0 to 1.0)
# Complaints with confidence below this will be flagged for manual review
app.ai.confidence.threshold=0.6

# Auto-assign department based on AI (true/false)
app.ai.auto.assign=true

# ========================================
# LOGGING CONFIGURATION
# ========================================

# Logging level for application
logging.level.com.cms.complaintsystem=INFO

# Logging level for AI services
logging.level.com.cms.complaintsystem.service.ImageAnalysisService=DEBUG
logging.level.com.cms.complaintsystem.service.AIService=DEBUG

# ========================================
# SERVER CONFIGURATION
# ========================================

# Server port
server.port=8080

# Session timeout (in minutes)
server.servlet.session.timeout=30m